<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agd-memory</title>
<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
<style>
:root {
  --bg:           #ffffff;
  --bg-2:         #fafafa;
  --bg-3:         #f4f4f5;
  --rule:         #e4e4e7;
  --rule-2:       #d4d4d8;
  --ink:          #18181b;
  --ink-2:        #3f3f46;
  --ink-3:        #71717a;
  --ink-4:        #a1a1aa;
  --accent:       #7c3aed;
  --accent-soft:  #f5f3ff;
  --accent-bord:  #ddd6fe;
  --accent-ink:   #5b21b6;
}
[data-theme="dark"] {
  --bg:           #09090b;
  --bg-2:         #131316;
  --bg-3:         #1c1c20;
  --rule:         #27272a;
  --rule-2:       #3f3f46;
  --ink:          #fafafa;
  --ink-2:        #d4d4d8;
  --ink-3:        #a1a1aa;
  --ink-4:        #71717a;
  --accent:       #a78bfa;
  --accent-soft:  #1e1b3a;
  --accent-bord:  #3b2f6a;
  --accent-ink:   #c4b5fd;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Inter", ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
  font-feature-settings: "cv11", "ss01", "ss03";
  font-size: 14.5px;
  line-height: 1.55;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
@supports (font-variation-settings: normal) {
  body { font-family: "Inter var", "Inter", ui-sans-serif, -apple-system, system-ui, sans-serif; }
}
.mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-feature-settings: "calt" 0; }

/* ── Topbar ──────────────────────────────────────────────────────── */
.topbar {
  height: 52px;
  display: flex; align-items: center; gap: 14px;
  padding: 0 20px;
  border-bottom: 1px solid var(--rule);
  background: var(--bg);
  position: sticky; top: 0; z-index: 5;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; }
.brand .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.brand .path { font-family: "JetBrains Mono", ui-monospace, monospace; color: var(--ink-3); font-weight: 400; font-size: 11.5px; }
.spacer { flex: 1; }

.search-trigger {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--bg-2); border: 1px solid var(--rule); border-radius: 8px;
  padding: 5px 12px; font-size: 12.5px; color: var(--ink-3);
  cursor: pointer; transition: all 120ms; min-width: 200px;
}
.search-trigger:hover { border-color: var(--rule-2); color: var(--ink-2); }
.search-trigger kbd {
  font-family: "JetBrains Mono", monospace; font-size: 10.5px;
  background: var(--bg); padding: 1px 5px; border-radius: 4px;
  border: 1px solid var(--rule); color: var(--ink-3); margin-left: auto;
}
[data-theme="dark"] .search-trigger kbd {
  background: var(--bg-3);
  border-color: var(--rule-2);
  color: var(--ink-2);
}
.icon-btn {
  width: 32px; height: 32px;
  border-radius: 7px;
  background: var(--bg-2);
  border: 1px solid var(--rule);
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--ink-2); cursor: pointer; font-size: 15px;
  transition: all 120ms;
}
.icon-btn:hover { background: var(--bg-3); color: var(--ink); border-color: var(--rule-2); }
[data-theme="dark"] .icon-btn:hover { box-shadow: inset 0 1px 0 rgba(255,255,255,.04); }
.mode-toggle {
  display: inline-flex; padding: 2px;
  background: var(--bg-2); border: 1px solid var(--rule); border-radius: 7px;
}
.mode-toggle button {
  padding: 4px 12px; border-radius: 5px;
  font-size: 12.5px; color: var(--ink-3); cursor: pointer;
  transition: all 130ms;
}
.mode-toggle button.active {
  background: var(--bg); color: var(--ink);
  font-weight: 500;
  box-shadow: 0 1px 2px rgba(0,0,0,.05);
}
[data-theme="dark"] .mode-toggle button.active {
  background: var(--bg-3);
  box-shadow:
    0 1px 2px rgba(0,0,0,.4),
    inset 0 1px 0 rgba(255,255,255,.04);
}

/* Mode show/hide ─────────────────────────────────────────────────── */
body.mode-read  .graph-only { display: none !important; }
body.mode-graph .read-only  { display: none !important; }

/* ── Layout ──────────────────────────────────────────────────────── */
.shell { height: calc(100% - 52px); display: flex; }
.sidebar {
  width: 260px; flex-shrink: 0;
  border-right: 1px solid var(--rule);
  background: var(--bg);
  overflow-y: auto;
  padding: 18px 0 60px;
}
.main {
  flex: 1; min-width: 0;
  display: flex;
  background: var(--bg);
}

/* ── Sidebar ─────────────────────────────────────────────────────── */
.sidebar .doc-title {
  padding: 4px 18px 14px;
  font-size: 13px; font-weight: 600; color: var(--ink);
  cursor: pointer;
  display: flex; align-items: center; gap: 8px;
}
.sidebar .doc-title:hover { color: var(--accent); }
.sidebar .doc-title .ico { color: var(--ink-3); font-size: 12px; }

.sidebar .sec {
  padding: 8px 0;
  border-top: 1px solid var(--rule);
  margin: 0 0;
}
.sidebar .sec-head {
  padding: 6px 18px 4px;
  font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--ink-3); font-weight: 600;
}
.sidebar .sec-item {
  padding: 4px 18px 4px 24px;
  font-family: "JetBrains Mono", monospace;
  font-size: 12.5px;
  color: var(--ink-2);
  cursor: pointer;
  border-left: 2px solid transparent;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: all 100ms;
}
.sidebar .sec-item:hover { background: var(--bg-2); color: var(--ink); }
.sidebar .sec-item.active {
  color: var(--accent-ink);
  background: var(--accent-soft);
  border-left-color: var(--accent);
}
[data-theme="dark"] .sidebar .sec-item.active { color: var(--accent-ink); }

/* ── Reader (table/schema view, full-width) ──────────────────────── */
#reader {
  flex: 1; overflow-y: auto;
  scroll-behavior: smooth;
  padding: 0;
}
.reader-inner {
  max-width: none;
  margin: 0;
  padding: 24px 32px 80px;
}
.doc-head {
  display: flex; align-items: baseline; gap: 18px;
  flex-wrap: wrap;
  padding-bottom: 14px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--rule);
}
.doc-h1 {
  font-size: 22px; font-weight: 700; letter-spacing: -0.02em;
  color: var(--ink); margin: 0;
}
.doc-sub { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-3); }
.doc-sub .stat .n { color: var(--ink); font-weight: 600; margin-right: 3px; }

.toolbar { margin-left: auto; display: inline-flex; gap: 6px; }

.section-h {
  display: flex; align-items: center; gap: 12px;
  margin: 28px 0 0;
  padding: 8px 12px;
  background: var(--bg-2);
  border: 1px solid var(--rule);
  border-bottom: 0;
  border-radius: 8px 8px 0 0;
  position: sticky;
  top: 0;
  z-index: 2;
}
.section-h:first-of-type { margin-top: 0; }
.section-h .name {
  font-size: 13.5px; font-weight: 600; color: var(--ink);
  letter-spacing: -0.005em;
}
.section-h .id-anchor {
  font-family: "JetBrains Mono", monospace;
  font-size: 10.5px; color: var(--ink-4);
}
.section-h .count {
  margin-left: auto;
  font-size: 11.5px; color: var(--ink-3);
}

/* Column header row (Notion-database-like) */
.col-h {
  display: grid;
  grid-template-columns: 92px minmax(180px, 1.2fr) minmax(220px, 2fr) 96px 96px 24px;
  gap: 12px;
  align-items: center;
  padding: 6px 12px;
  font-family: "JetBrains Mono", monospace;
  font-size: 10.5px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-4);
  background: var(--bg);
  border-left: 1px solid var(--rule);
  border-right: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}

.block-tbl {
  border: 1px solid var(--rule);
  border-top: 0;
  border-radius: 0 0 8px 8px;
  background: var(--bg);
  overflow: hidden;
  margin-bottom: 28px;
}

.block {
  display: grid;
  grid-template-columns: 92px minmax(180px, 1.2fr) minmax(220px, 2fr) 96px 96px 24px;
  gap: 12px;
  align-items: center;
  padding: 9px 12px;
  border-bottom: 1px solid var(--rule);
  cursor: pointer;
  transition: background 100ms;
  scroll-margin-top: 80px;
  min-height: 38px;
}
.block:last-child { border-bottom: none; }
.block:hover { background: var(--bg-2); }
.block.expanded { background: var(--bg-2); }
.block.flash { animation: flash 1.4s ease; }
@keyframes flash {
  0%   { background: transparent; }
  20%  { background: var(--accent-soft); }
  100% { background: transparent; }
}

.block .col-kind { display: inline-flex; }
.block .col-id {
  font-family: "JetBrains Mono", monospace;
  font-size: 12.5px; font-weight: 500; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.block .col-id .hash { color: var(--ink-4); }
.block .col-desc {
  font-size: 13px; color: var(--ink-2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.block .col-desc .body-snip { color: var(--ink-3); }
.block .col-date {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; color: var(--ink-3);
  text-align: right;
  white-space: nowrap;
}
.block .col-links {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px; color: var(--ink-3);
  text-align: right;
  white-space: nowrap;
}
.block .col-links .pos { color: var(--accent); }
.block .col-toggle {
  color: var(--ink-4);
  font-size: 11px;
  transition: transform 150ms;
  display: inline-flex; justify-content: center;
  user-select: none;
}
.block.expanded .col-toggle { transform: rotate(90deg); }

/* Expanded panel below the row */
.block-expand {
  display: none;
  border-bottom: 1px solid var(--rule);
  background: var(--bg);
  padding: 18px 24px 22px 116px;
}
.block-expand.open { display: block; }
.block-expand:last-child { border-bottom: none; }
.block-expand .body {
  font-size: 14px;
  line-height: 1.65;
  color: var(--ink);
  max-width: 820px;
}
.block-expand .body > :first-child { margin-top: 0; }
.block-expand .body > :last-child { margin-bottom: 0; }
.block-expand .body p { margin: 8px 0; }
.block-expand .body h1 { font-size: 17px; font-weight: 600; margin: 14px 0 6px; }
.block-expand .body h2 { font-size: 15px; font-weight: 600; margin: 12px 0 6px; }
.block-expand .body h3 { font-size: 14px; font-weight: 600; margin: 10px 0 4px; color: var(--ink-2); }
.block-expand .body a {
  color: var(--accent);
  text-decoration: underline;
  text-decoration-color: color-mix(in srgb, var(--accent) 35%, transparent);
  text-underline-offset: 2px;
}
.block-expand .body a:hover { text-decoration-color: var(--accent); }
.block-expand .body code {
  font-family: "JetBrains Mono", monospace;
  font-size: 12.5px;
  background: var(--bg-3); border: 1px solid var(--rule);
  padding: 1px 5px; border-radius: 4px;
  color: var(--ink);
}
.block-expand .body pre {
  background: var(--bg-3); border: 1px solid var(--rule);
  padding: 11px 13px; border-radius: 6px;
  font-size: 12.5px; overflow-x: auto;
}
.block-expand .body pre code { background: transparent; border: 0; padding: 0; }
.block-expand .body blockquote {
  border-left: 3px solid var(--accent);
  padding: 4px 0 4px 12px; margin: 10px 0; color: var(--ink-2);
}
.block-expand .body ul, .block-expand .body ol { padding-left: 22px; }
.block-expand .body table { border-collapse: collapse; margin: 10px 0; font-size: 12.5px; }
.block-expand .body th, .block-expand .body td { border: 1px solid var(--rule); padding: 5px 9px; }
.block-expand .body th { background: var(--bg-3); font-weight: 600; }

.block-expand .meta {
  margin-top: 14px;
  display: flex; flex-wrap: wrap; gap: 14px;
  font-size: 12px;
}
.block-expand .meta .label {
  color: var(--ink-4);
  font-family: "JetBrains Mono", monospace;
  font-size: 10.5px; letter-spacing: 0.03em;
  margin-right: 6px;
}
.block-expand .meta a {
  font-family: "JetBrains Mono", monospace;
  color: var(--accent); cursor: pointer;
  font-size: 12px;
}
.block-expand .meta a:hover { text-decoration: underline; }
.block-expand .meta .group { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }

/* ── Search overlay (cmd-k) ──────────────────────────────────────── */
.cmdk-overlay {
  position: fixed; inset: 0;
  background: color-mix(in srgb, var(--ink) 24%, transparent);
  backdrop-filter: blur(4px);
  display: none;
  align-items: flex-start; justify-content: center;
  padding-top: 12vh; z-index: 50;
}
.cmdk-overlay.open { display: flex; }
.cmdk {
  width: min(640px, 92vw);
  background: var(--bg);
  border: 1px solid var(--rule);
  border-radius: 12px;
  box-shadow: 0 20px 50px -20px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.04);
  overflow: hidden;
}
[data-theme="dark"] .cmdk { box-shadow: 0 20px 50px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.06); }
.cmdk input {
  width: 100%;
  background: transparent; border: 0; outline: 0;
  padding: 16px 20px;
  color: var(--ink);
  font-size: 15.5px;
  border-bottom: 1px solid var(--rule);
}
.cmdk input::placeholder { color: var(--ink-4); }
.cmdk-results { max-height: 50vh; overflow-y: auto; padding: 6px; }
.cmdk-result {
  display: flex; gap: 12px; align-items: baseline;
  padding: 10px 14px; border-radius: 6px; cursor: pointer;
}
.cmdk-result:hover, .cmdk-result.active { background: var(--bg-2); }
.cmdk-result .id { font-family: "JetBrains Mono", monospace; font-size: 13px; color: var(--ink); }
.cmdk-result .desc { color: var(--ink-3); font-size: 12px; }

/* ── Graph mode ──────────────────────────────────────────────────── */
.graph-wrap { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#cy { background: var(--bg); flex: 1; min-height: 0; }
.graph-controls {
  border-top: 1px solid var(--rule);
  padding: 8px 16px;
  font-size: 12px; color: var(--ink-3);
  background: var(--bg);
  display: flex; align-items: center; gap: 12px;
}
.pill-btn {
  padding: 4px 12px; border-radius: 6px;
  background: var(--bg); border: 1px solid var(--rule);
  color: var(--ink-2); cursor: pointer; font-size: 12px;
  transition: all 120ms;
}
.pill-btn:hover { border-color: var(--accent); color: var(--accent); }

.details-pane {
  width: 380px; min-width: 320px;
  border-left: 1px solid var(--rule);
  background: var(--bg);
  overflow-y: auto;
  padding: 28px 26px;
}
.details-empty { color: var(--ink-3); padding-top: 24px; font-size: 13px; }

/* ── Scrollbars ──────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 6px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--rule-2); }

</style>
</head>
<body class="mode-read">
<header class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <span>agd-memory</span>
    <span class="path mono" id="filepath"></span>
  </div>
  <div class="spacer"></div>
  <button class="search-trigger" id="search-trigger">
    <span>Search blocks…</span>
    <kbd>⌘K</kbd>
  </button>
  <div class="mode-toggle" role="tablist">
    <button id="m-read" class="active" data-mode="read">Read</button>
    <button id="m-graph" data-mode="graph">Graph</button>
  </div>
  <button class="icon-btn" id="theme-toggle" title="Toggle theme">☼</button>
</header>

<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <div id="reader" class="read-only"></div>
    <div class="graph-wrap graph-only">
      <div id="cy"></div>
      <div class="graph-controls">
        <span>drag · scroll to zoom · click node</span>
        <span class="spacer" style="flex:1"></span>
        <button id="fit" class="pill-btn">fit</button>
        <button id="relayout" class="pill-btn">relayout</button>
      </div>
    </div>
    <aside class="details-pane graph-only" id="details"></aside>
  </div>
</div>

<div class="cmdk-overlay" id="cmdk">
  <div class="cmdk">
    <input type="text" id="cmdk-input" placeholder="Search id, desc, body…" autocomplete="off">
    <div class="cmdk-results" id="cmdk-results"></div>
  </div>
</div>

<script>
const md = window.markdownit({ html: false, linkify: true, breaks: false });

const KIND_COLORS = {
  "x-user":     "#9333ea",
  "x-feedback": "#ea580c",
  "x-project":  "#16a34a",
  "x-reference":"#2563eb",
  "x-edge":     "#db2777",
  "x-stress":   "#71717a",
  "code":       "#ca8a04",
  "raw":        "#ca8a04",
  "ul":         "#16a34a",
  "ol":         "#16a34a",
  "quote":      "#db2777",
};
const colorFor = k => KIND_COLORS[k] || "#71717a";
const isHeading = k => ["h1","h2","h3","h4"].includes(k);

const dateRE = /(\d{4}-\d{2}-\d{2})/;
const dateFromId = id => { const m = (id || "").match(dateRE); return m ? m[1] : null; };

let DATA = null;
let SECTIONS = null;
let DOC_TITLE = null;
let MODE = "read";
let cy = null;
let graphBuilt = false;

function buildSections() {
  // Treat h1 as document title; h2+ as section markers. Non-heading
  // blocks fall under the most recent heading they were preceded by.
  // Untitled sections (no heading yet) go into a synthetic "Notes".
  SECTIONS = [];
  DOC_TITLE = null;
  let current = null;
  for (const b of DATA.blocks) {
    if (b.kind === "h1" && !DOC_TITLE) {
      DOC_TITLE = b;
      continue;
    }
    if (isHeading(b.kind)) {
      current = { heading: b, blocks: [] };
      SECTIONS.push(current);
      continue;
    }
    if (!current) {
      current = { heading: null, blocks: [] };
      SECTIONS.push(current);
    }
    current.blocks.push(b);
  }
  // Drop sections that ended up empty (a heading with no children)
  SECTIONS = SECTIONS.filter(s => s.blocks.length > 0);
}

function sectionName(s) {
  if (!s.heading) return "Notes";
  // Heading body is inline text; viewer.py joins it into `body` already.
  const t = (s.heading.body || s.heading.id || "").trim();
  return t || s.heading.id;
}

async function load() {
  const r = await fetch("/memory.json");
  const j = await r.json();
  if (j.error) {
    document.getElementById("reader").innerHTML = `<div style="padding:60px;color:#ef4444">${j.error}</div>`;
    return;
  }
  DATA = j;
  document.getElementById("filepath").textContent = j.path;
  buildSections();
  renderSidebar();
  renderReader();
}

function renderSidebar() {
  const el = document.getElementById("sidebar");
  el.innerHTML = "";

  if (DOC_TITLE) {
    const t = document.createElement("div");
    t.className = "doc-title";
    t.innerHTML = `<span class="ico">◆</span><span>${escapeHTML(DOC_TITLE.body || "Memory")}</span>`;
    t.onclick = () => document.getElementById("reader").scrollTo({ top: 0, behavior: "smooth" });
    el.appendChild(t);
  }

  for (const s of SECTIONS) {
    const sec = document.createElement("div");
    sec.className = "sec";
    const head = document.createElement("div");
    head.className = "sec-head";
    head.textContent = sectionName(s);
    sec.appendChild(head);
    for (const b of s.blocks) {
      const it = document.createElement("div");
      it.className = "sec-item";
      it.dataset.id = b.id;
      it.textContent = "#" + b.id;
      it.title = b.desc || "";
      it.onclick = () => jumpTo(b.id);
      sec.appendChild(it);
    }
    el.appendChild(sec);
  }
}

function renderReader() {
  const r = document.getElementById("reader");
  r.innerHTML = "";
  const inner = document.createElement("div");
  inner.className = "reader-inner";

  // Doc head: title + stats + toolbar (all on one strip)
  const docH = document.createElement("div");
  docH.className = "doc-head";
  const k = DATA.stats.kinds;
  docH.innerHTML = `
    <h1 class="doc-h1">${escapeHTML(DOC_TITLE?.body || "Memory")}</h1>
    <span class="doc-sub">
      <span class="stat"><span class="n">${DATA.stats.blocks}</span>blocks</span>
      <span class="stat"><span class="n">${DATA.stats.edges}</span>edges</span>
      <span class="stat"><span class="n">${Object.keys(k).length}</span>kinds</span>
      <span class="stat"><span class="n">${(DATA.stats.bytes/1024).toFixed(1)} KB</span></span>
      <span class="stat mono" style="color:var(--ink-4)">${DATA.path.split('/').pop()}</span>
    </span>
    <span class="toolbar">
      <button id="expand-all" class="pill-btn">Expand all</button>
      <button id="collapse-all" class="pill-btn">Collapse all</button>
    </span>
  `;
  inner.appendChild(docH);

  for (const s of SECTIONS) {
    const sh = document.createElement("div");
    sh.className = "section-h";
    sh.id = s.heading ? "s-" + s.heading.id : "s-notes";
    sh.innerHTML = `
      <span class="name">${escapeHTML(sectionName(s))}</span>
      ${s.heading ? `<span class="id-anchor mono">#${escapeHTML(s.heading.id)}</span>` : ""}
      <span class="count">${s.blocks.length} ${s.blocks.length === 1 ? "entry" : "entries"}</span>
    `;
    inner.appendChild(sh);

    const colH = document.createElement("div");
    colH.className = "col-h";
    colH.innerHTML = `
      <span>kind</span>
      <span>id</span>
      <span>desc / excerpt</span>
      <span style="text-align:right">date</span>
      <span style="text-align:right">links</span>
      <span></span>
    `;
    inner.appendChild(colH);

    const tbl = document.createElement("div");
    tbl.className = "block-tbl";
    for (const b of s.blocks) {
      tbl.appendChild(renderBlockRow(b));
      tbl.appendChild(renderBlockExpand(b));
    }
    inner.appendChild(tbl);
  }
  r.appendChild(inner);

  // Wire row clicks (toggle), but ignore clicks on inner anchors
  r.querySelectorAll(".block").forEach(row => {
    row.onclick = e => {
      if (e.target.closest("a[data-id]")) return;
      toggleBlock(row.dataset.id);
    };
  });
  r.querySelectorAll("a[data-id]").forEach(a => {
    a.onclick = e => { e.preventDefault(); jumpTo(a.dataset.id); };
  });
  document.getElementById("expand-all").onclick = () => expandAll(true);
  document.getElementById("collapse-all").onclick = () => expandAll(false);

  setupScrollSpy();
}

function renderBlockRow(b) {
  const c = colorFor(b.kind);
  const date = dateFromId(b.id) || "—";
  const desc = b.desc ? escapeHTML(b.desc) : "";
  const snip = (b.body || "").replace(/\s+/g, " ").trim().slice(0, 140);
  const descCell = desc
    ? `${desc}${snip ? ` <span class="body-snip">· ${escapeHTML(snip)}</span>` : ""}`
    : `<span class="body-snip">${escapeHTML(snip)}</span>`;
  const r = b.refs.length, bk = b.backlinks.length;
  const linksCell = (r || bk)
    ? `${r ? `<span class="pos">→ ${r}</span>` : ""}${(r && bk) ? "  " : ""}${bk ? `← ${bk}` : ""}`
    : "—";

  const row = document.createElement("div");
  row.className = "block";
  row.id = "b-" + b.id;
  row.dataset.id = b.id;
  row.innerHTML = `
    <span class="col-kind"><span class="kind-chip" style="color:${c}">${escapeHTML(b.kind)}</span></span>
    <span class="col-id"><span class="hash">#</span>${escapeHTML(b.id)}</span>
    <span class="col-desc">${descCell}</span>
    <span class="col-date">${date}</span>
    <span class="col-links">${linksCell}</span>
    <span class="col-toggle">›</span>
  `;
  return row;
}

function renderBlockExpand(b) {
  const exp = document.createElement("div");
  exp.className = "block-expand";
  exp.dataset.expandFor = b.id;
  let html = "";
  if (b.body && b.body.length) html += `<div class="body">${md.render(b.body)}</div>`;
  if (b.refs.length || b.backlinks.length) {
    html += `<div class="meta">`;
    if (b.refs.length)
      html += `<span class="group"><span class="label">refs →</span>${b.refs.map(x => `<a data-id="${x}">#${x}</a>`).join(" ")}</span>`;
    if (b.backlinks.length)
      html += `<span class="group"><span class="label">← backlinks</span>${b.backlinks.map(x => `<a data-id="${x}">#${x}</a>`).join(" ")}</span>`;
    html += `</div>`;
  }
  exp.innerHTML = html;
  return exp;
}

function toggleBlock(id) {
  const row = document.getElementById("b-" + id);
  const exp = document.querySelector(`.block-expand[data-expand-for="${id}"]`);
  if (!row || !exp) return;
  const isOpen = row.classList.toggle("expanded");
  exp.classList.toggle("open", isOpen);
}

function expandAll(open) {
  document.querySelectorAll(".block").forEach(r => r.classList.toggle("expanded", open));
  document.querySelectorAll(".block-expand").forEach(e => e.classList.toggle("open", open));
}

function setupScrollSpy() {
  const reader = document.getElementById("reader");
  const blocks = reader.querySelectorAll(".block");
  if (!blocks.length) return;
  const obs = new IntersectionObserver((entries) => {
    let best = null, bestTop = Infinity;
    for (const en of entries) {
      if (en.isIntersecting) {
        const top = en.boundingClientRect.top;
        if (top >= 0 && top < bestTop) { bestTop = top; best = en.target; }
      }
    }
    if (best) setSidebarActive(best.id.replace(/^b-/, ""));
  }, { root: reader, rootMargin: "0px 0px -75% 0px", threshold: 0.01 });
  blocks.forEach(b => obs.observe(b));
}

function setSidebarActive(id) {
  document.querySelectorAll(".sec-item").forEach(el =>
    el.classList.toggle("active", el.dataset.id === id));
  const a = document.querySelector(".sec-item.active");
  if (a) {
    const sb = document.getElementById("sidebar");
    const sbRect = sb.getBoundingClientRect();
    const aRect = a.getBoundingClientRect();
    if (aRect.top < sbRect.top + 60 || aRect.bottom > sbRect.bottom - 40) {
      sb.scrollTo({ top: a.offsetTop - sb.clientHeight / 3, behavior: "smooth" });
    }
  }
}

function jumpTo(id) {
  if (MODE === "read") {
    const el = document.getElementById("b-" + id);
    if (!el) return;
    const exp = document.querySelector(`.block-expand[data-expand-for="${id}"]`);
    el.classList.add("expanded");
    if (exp) exp.classList.add("open");
    el.scrollIntoView({ behavior: "smooth", block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;
    el.classList.add("flash");
    setSidebarActive(id);
  } else {
    selectGraph(id);
  }
}

/* ── Mode ────────────────────────────────────────────────────────── */
function setMode(m) {
  MODE = m;
  document.body.classList.toggle("mode-read",  m === "read");
  document.body.classList.toggle("mode-graph", m === "graph");
  document.getElementById("m-read").classList.toggle("active",  m === "read");
  document.getElementById("m-graph").classList.toggle("active", m === "graph");
  if (m === "graph" && !graphBuilt) {
    setTimeout(() => { renderGraph(); graphBuilt = true; }, 30);
  } else if (m === "graph" && cy) {
    setTimeout(() => { cy.resize(); cy.fit(undefined, 30); }, 50);
  }
}

/* ── Graph ───────────────────────────────────────────────────────── */
function renderGraph() {
  const styles = getComputedStyle(document.documentElement);
  const stroke = styles.getPropertyValue("--bg").trim();
  const edgeC  = styles.getPropertyValue("--rule-2").trim();
  const accent = styles.getPropertyValue("--accent").trim();
  const inkC   = styles.getPropertyValue("--ink-2").trim();
  const els = [];
  const present = new Set(DATA.blocks.map(b => b.id));
  for (const b of DATA.blocks) {
    if (isHeading(b.kind)) continue;
    els.push({ data: { id: b.id, kind: b.kind, color: colorFor(b.kind), degree: b.refs.length + b.backlinks.length }});
  }
  for (const b of DATA.blocks) {
    if (isHeading(b.kind)) continue;
    for (const t of b.refs) if (present.has(t) && !isHeading(DATA.blocks.find(x => x.id === t)?.kind)) {
      els.push({ data: { id: `${b.id}__${t}`, source: b.id, target: t }});
    }
  }
  if (cy) cy.destroy();
  cy = cytoscape({
    container: document.getElementById("cy"),
    elements: els,
    style: [
      { selector: "node", style: {
          "background-color": "data(color)",
          "label": "data(id)",
          "font-family": "JetBrains Mono, ui-monospace, monospace",
          "font-size": 10, "color": inkC,
          "text-valign": "bottom", "text-margin-y": 6,
          "text-outline-color": stroke, "text-outline-width": 2,
          "width": "mapData(degree, 0, 8, 12, 32)",
          "height": "mapData(degree, 0, 8, 12, 32)",
          "border-width": 2, "border-color": stroke,
          "transition-property": "border-color, opacity", "transition-duration": 150,
        }
      },
      { selector: "node:selected", style: { "border-width": 3, "border-color": accent }},
      { selector: "node.faded", style: { "opacity": 0.18 }},
      { selector: "edge", style: {
          "width": 1.2, "line-color": edgeC,
          "target-arrow-color": edgeC, "target-arrow-shape": "triangle",
          "curve-style": "bezier", "arrow-scale": 0.7, "opacity": 0.6,
        }
      },
      { selector: "edge.highlight", style: {
          "line-color": accent, "target-arrow-color": accent,
          "width": 2.4, "opacity": 1,
        }
      },
    ],
    layout: { name: "cose", animate: false, idealEdgeLength: 90, nodeRepulsion: 6000, padding: 30 },
    wheelSensitivity: 0.2,
  });
  cy.on("tap", "node", e => selectGraph(e.target.id()));
  cy.on("tap", evt => { if (evt.target === cy) selectGraph(null); });
  document.getElementById("fit").onclick = () => cy.fit(undefined, 30);
  document.getElementById("relayout").onclick = () =>
    cy.layout({ name: "cose", animate: true, animationDuration: 600, idealEdgeLength: 90, nodeRepulsion: 6000, padding: 30 }).run();
  setTimeout(() => { cy.resize(); cy.fit(undefined, 30); }, 60);
}

function selectGraph(id) {
  if (cy) {
    cy.elements().removeClass("highlight");
    cy.nodes().unselect();
    if (id) {
      const n = cy.getElementById(id);
      if (n.length) {
        n.select(); n.connectedEdges().addClass("highlight");
        cy.animate({ center: { eles: n }, zoom: Math.max(cy.zoom(), 1.1) }, { duration: 350 });
      }
    }
  }
  renderDetails(id);
}

function renderDetails(id) {
  const el = document.getElementById("details");
  if (!id) { el.innerHTML = `<div class="details-empty">Click a node to see its body.</div>`; return; }
  const b = DATA.blocks.find(x => x.id === id);
  if (!b) { el.innerHTML = `<div class="details-empty">id not found: ${id}</div>`; return; }
  const c = colorFor(b.kind);
  el.innerHTML = `
    <div class="head" style="display:flex; align-items:center; gap:10px; margin-bottom:6px;">
      <span class="kind-chip" style="color:${c};">${escapeHTML(b.kind)}</span>
      <span class="id mono" style="font-weight:600;"><span style="color:var(--ink-4)">#</span>${escapeHTML(b.id)}</span>
    </div>
    ${b.desc ? `<div class="desc" style="color:var(--ink-3);font-size:13.5px;margin-bottom:14px;">${escapeHTML(b.desc)}</div>` : ""}
    ${b.body ? `<div class="body" style="font-size:14.5px;line-height:1.65;">${md.render(b.body)}</div>` : ""}
    ${b.refs.length ? `<div class="meta" style="margin-top:18px;font-size:12px;"><span class="label" style="color:var(--ink-4);font-family:monospace;font-size:10.5px;margin-right:6px;">refs →</span>${b.refs.map(x => `<a data-id="${x}" style="color:var(--accent);font-family:monospace;cursor:pointer;">#${x}</a>`).join(" ")}</div>` : ""}
    ${b.backlinks.length ? `<div class="meta" style="margin-top:8px;font-size:12px;"><span class="label" style="color:var(--ink-4);font-family:monospace;font-size:10.5px;margin-right:6px;">← backlinks</span>${b.backlinks.map(x => `<a data-id="${x}" style="color:var(--accent);font-family:monospace;cursor:pointer;">#${x}</a>`).join(" ")}</div>` : ""}
  `;
  el.querySelectorAll("a[data-id]").forEach(a => {
    a.onclick = () => { setMode("read"); setTimeout(() => jumpTo(a.dataset.id), 150); };
  });
}

/* ── Search ──────────────────────────────────────────────────────── */
function openSearch() {
  document.getElementById("cmdk").classList.add("open");
  const inp = document.getElementById("cmdk-input");
  inp.value = ""; inp.focus();
  renderCmdk("");
}
function closeSearch() { document.getElementById("cmdk").classList.remove("open"); }
function renderCmdk(q) {
  const ql = (q || "").toLowerCase().trim();
  const matches = DATA.blocks.filter(b => {
    if (isHeading(b.kind)) return false;
    if (!ql) return true;
    return (b.id || "").toLowerCase().includes(ql)
        || (b.desc || "").toLowerCase().includes(ql)
        || (b.body || "").toLowerCase().includes(ql);
  }).slice(0, 30);
  const r = document.getElementById("cmdk-results");
  r.innerHTML = matches.map((b, i) =>
    `<div class="cmdk-result ${i===0?"active":""}" data-id="${b.id}">
       <span class="kind-chip" style="color:${colorFor(b.kind)};">${b.kind}</span>
       <span class="id">#${escapeHTML(b.id)}</span>
       ${b.desc ? `<span class="desc">${escapeHTML(b.desc)}</span>` : ""}
     </div>`).join("") || `<div style="padding:18px;color:var(--ink-3);">No matches.</div>`;
  r.querySelectorAll(".cmdk-result").forEach(el => {
    el.onclick = () => { closeSearch(); jumpTo(el.dataset.id); };
  });
}

/* ── Theme ───────────────────────────────────────────────────────── */
function setTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  document.getElementById("theme-toggle").textContent = t === "dark" ? "☾" : "☼";
  localStorage.setItem("agd-viewer-theme", t);
  if (cy) renderGraph();
}
setTheme(localStorage.getItem("agd-viewer-theme") || "light");

function escapeHTML(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c])); }

/* ── Wiring ──────────────────────────────────────────────────────── */
document.getElementById("search-trigger").onclick = openSearch;
document.getElementById("cmdk-input").addEventListener("input", e => renderCmdk(e.target.value));
document.getElementById("cmdk").addEventListener("click", e => { if (e.target.id === "cmdk") closeSearch(); });
document.getElementById("m-read").onclick = () => setMode("read");
document.getElementById("m-graph").onclick = () => setMode("graph");
document.getElementById("theme-toggle").onclick = () =>
  setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");

window.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openSearch(); return; }
  if (e.key === "/" && !["INPUT","TEXTAREA"].includes(document.activeElement.tagName)) { e.preventDefault(); openSearch(); return; }
  if (e.key === "Escape") {
    if (document.getElementById("cmdk").classList.contains("open")) { closeSearch(); return; }
    if (MODE === "graph") selectGraph(null);
  }
  if (document.getElementById("cmdk").classList.contains("open")) {
    const items = [...document.querySelectorAll(".cmdk-result")];
    if (!items.length) return;
    const cur = items.findIndex(i => i.classList.contains("active"));
    if (e.key === "ArrowDown") { e.preventDefault(); items[cur]?.classList.remove("active"); items[Math.min(items.length-1, cur+1)].classList.add("active"); }
    if (e.key === "ArrowUp")   { e.preventDefault(); items[cur]?.classList.remove("active"); items[Math.max(0, cur-1)].classList.add("active"); }
    if (e.key === "Enter")     { const a = items.find(i => i.classList.contains("active")); if (a) { closeSearch(); jumpTo(a.dataset.id); }}
  }
});

load();
</script>
</body>
</html>
