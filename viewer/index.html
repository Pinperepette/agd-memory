<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agd-memory</title>
<script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<script src="https://unpkg.com/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
<style>
/* ─────────────────────────────────────────────────────────────────────
   Palette: light = warm cream "paper", dark = warm walnut. Accents are
   burnt orange + amber + deep navy + pine green. Cyan is gone. */
:root {
  --paper:     #faf6ed;
  --paper-2:   #f3eddc;
  --paper-3:   #ebe2cc;
  --rule:      #d9cfb1;
  --rule-2:    #c8bb96;
  --ink:       #1f1d18;
  --ink-2:     #4b443a;
  --ink-3:     #857d6c;
  --ink-4:     #b3a98f;
  --accent:    #b34d1a;   /* burnt orange */
  --accent-2:  #9a6500;   /* amber */
  --accent-3:  #1e3a8a;   /* deep navy */
  --good:      #15623c;
  --warn:      #9a3412;
  --shadow:    0 1px 0 rgba(31, 29, 24, .04), 0 6px 24px -12px rgba(31, 29, 24, .12);
  --shadow-hi: 0 1px 0 rgba(31, 29, 24, .06), 0 14px 40px -18px rgba(31, 29, 24, .25);
}
[data-theme="dark"] {
  --paper:     #1c1917;
  --paper-2:   #25211d;
  --paper-3:   #2e2924;
  --rule:      #3a342d;
  --rule-2:    #56503f;
  --ink:       #ece2c8;
  --ink-2:     #c8b993;
  --ink-3:     #8a8169;
  --ink-4:     #57513f;
  --accent:    #fb923c;
  --accent-2:  #fbbf24;
  --accent-3:  #93c5fd;
  --good:      #86efac;
  --warn:      #fda4af;
  --shadow:    0 1px 0 rgba(0,0,0,.4), 0 8px 24px -8px rgba(0,0,0,.5);
  --shadow-hi: 0 1px 0 rgba(0,0,0,.5), 0 16px 48px -16px rgba(0,0,0,.7);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: ui-sans-serif, -apple-system, "Segoe UI", "Inter", system-ui, sans-serif;
  font-size: 15px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
.serif { font-family: "Iowan Old Style", "Source Serif Pro", "Charter", "Palatino Linotype", Palatino, Georgia, serif; }
.mono  { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, "Cascadia Mono", monospace; }

/* Topbar ────────────────────────────────────────────────────────── */
.topbar {
  border-bottom: 1px solid var(--rule);
  background: var(--paper);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 18px;
  z-index: 5;
}
.brand {
  display: flex; align-items: baseline; gap: 10px;
  font-family: "Iowan Old Style", "Source Serif Pro", Charter, Georgia, serif;
}
.brand .mark {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--accent);
  display: inline-block;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
}
.brand .name { font-weight: 600; font-size: 17px; letter-spacing: -0.01em; color: var(--ink); }
.brand .path {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  color: var(--ink-3); font-size: 11px;
}
.spacer { flex: 1; }
.icon-btn {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: transparent;
  color: var(--ink-2);
  border: 1px solid transparent;
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  transition: all 120ms;
  font-size: 16px;
}
.icon-btn:hover { background: var(--paper-2); color: var(--ink); border-color: var(--rule); }
.mode-toggle {
  display: inline-flex;
  border: 1px solid var(--rule);
  border-radius: 999px;
  padding: 3px;
  background: var(--paper-2);
}
.mode-toggle button {
  padding: 5px 14px; border-radius: 999px;
  color: var(--ink-2); font-size: 12.5px;
  cursor: pointer; transition: all 130ms;
  letter-spacing: 0.02em;
}
.mode-toggle button.active {
  background: var(--ink); color: var(--paper);
  font-weight: 500;
}

/* Mode show/hide ──────────────────────────────────────────────────── */
body.mode-read  .graph-only { display: none !important; }
body.mode-graph .read-only  { display: none !important; }

/* Search overlay (cmd-k) ──────────────────────────────────────────── */
.search-trigger {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--paper-2);
  border: 1px solid var(--rule);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 12.5px;
  color: var(--ink-3);
  cursor: pointer;
  min-width: 180px;
  transition: all 120ms;
}
.search-trigger:hover { border-color: var(--rule-2); color: var(--ink-2); }
.search-trigger kbd {
  font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: 10.5px;
  background: var(--paper);
  padding: 1.5px 5px; border-radius: 4px;
  border: 1px solid var(--rule); color: var(--ink-3);
}
.cmdk-overlay {
  position: fixed; inset: 0;
  background: color-mix(in srgb, var(--ink) 30%, transparent);
  backdrop-filter: blur(4px);
  display: none;
  align-items: flex-start; justify-content: center;
  padding-top: 12vh; z-index: 50;
}
.cmdk-overlay.open { display: flex; }
.cmdk {
  width: min(640px, 92vw);
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 14px;
  box-shadow: var(--shadow-hi);
  overflow: hidden;
}
.cmdk input {
  width: 100%;
  background: transparent;
  border: 0; outline: 0;
  padding: 16px 20px;
  color: var(--ink);
  font-size: 16px;
  border-bottom: 1px solid var(--rule);
}
.cmdk-results { max-height: 50vh; overflow-y: auto; padding: 6px; }
.cmdk-result {
  display: flex; gap: 12px; align-items: baseline;
  padding: 10px 14px; border-radius: 8px; cursor: pointer;
}
.cmdk-result:hover, .cmdk-result.active { background: var(--paper-2); }
.cmdk-result .id { font-family: "JetBrains Mono", monospace; font-size: 13px; color: var(--ink); }
.cmdk-result .desc { color: var(--ink-3); font-size: 12px; }

/* Layout ──────────────────────────────────────────────────────────── */
.main { flex: 1; display: flex; min-height: 0; }

/* Timeline rail ─────────────────────────────────────────────────── */
.rail {
  width: 220px;
  flex-shrink: 0;
  border-right: 1px solid var(--rule);
  background: var(--paper);
  overflow-y: auto;
  padding: 28px 0 80px;
  position: relative;
}
.rail::before {
  content: "";
  position: absolute;
  left: 56px; top: 36px; bottom: 60px;
  width: 1px;
  background: linear-gradient(to bottom, transparent, var(--rule-2) 8%, var(--rule-2) 92%, transparent);
}
.rail-group { padding: 0 12px; margin-bottom: 18px; }
.rail-date {
  font-family: "JetBrains Mono", monospace;
  font-size: 10.5px; letter-spacing: 0.05em;
  color: var(--ink-3);
  padding: 0 0 8px 56px;
  text-transform: uppercase;
}
.rail-item {
  position: relative;
  padding: 6px 12px 6px 56px;
  cursor: pointer;
  transition: all 120ms;
  border-radius: 0 8px 8px 0;
}
.rail-item:hover { background: var(--paper-2); }
.rail-item.active {
  background: var(--paper-3);
  box-shadow: inset 2px 0 0 var(--accent);
}
.rail-item .dot {
  position: absolute;
  left: 50px; top: 50%; transform: translate(-50%, -50%);
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--ink-4);
  border: 2px solid var(--paper);
  box-shadow: 0 0 0 1px var(--rule-2);
  transition: all 150ms;
}
.rail-item:hover .dot { transform: translate(-50%, -50%) scale(1.3); }
.rail-item.active .dot {
  width: 11px; height: 11px;
  background: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
}
.rail-item .id {
  font-family: "JetBrains Mono", monospace;
  font-size: 11.5px;
  color: var(--ink-2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.rail-item.active .id { color: var(--ink); font-weight: 600; }
.rail-item .desc {
  font-size: 11px; color: var(--ink-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-top: 1px;
}

/* Reader ──────────────────────────────────────────────────────────── */
#reader {
  flex: 1;
  overflow-y: auto;
  scroll-behavior: smooth;
  background: var(--paper);
  padding: 0;
}
.reader-inner {
  max-width: 740px;
  margin: 0 auto;
  padding: 56px 56px 200px;
}
.reader-stats {
  display: flex; flex-wrap: wrap; gap: 18px;
  padding: 16px 20px;
  margin-bottom: 32px;
  background: var(--paper-2);
  border: 1px solid var(--rule);
  border-radius: 10px;
  font-size: 13px;
  color: var(--ink-2);
}
.reader-stats .stat .n {
  font-family: "Iowan Old Style", "Source Serif Pro", Charter, Georgia, serif;
  font-size: 22px; font-weight: 600;
  color: var(--ink);
  margin-right: 6px;
}
.reader-stats .stat .l {
  font-size: 11.5px; letter-spacing: 0.04em;
  color: var(--ink-3);
}
.reader-stats .stat { display: inline-flex; align-items: baseline; }

.section {
  background: var(--paper);
  margin: 0 0 36px;
  padding: 28px 32px 26px;
  border: 1px solid var(--rule);
  border-radius: 10px;
  box-shadow: var(--shadow);
  position: relative;
  scroll-margin-top: 24px;
  transition: box-shadow 250ms, border-color 250ms;
}
.section:hover { box-shadow: var(--shadow-hi); border-color: var(--rule-2); }
.section.flash {
  animation: flash 1.4s ease;
}
@keyframes flash {
  0%   { background: var(--paper); border-color: var(--rule); }
  18%  { background: color-mix(in srgb, var(--accent) 8%, var(--paper)); border-color: var(--accent); }
  100% { background: var(--paper); border-color: var(--rule); }
}
.section .meta-top {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.kind-chip {
  display: inline-flex; align-items: center;
  font-family: "JetBrains Mono", monospace;
  font-size: 10.5px;
  letter-spacing: 0.06em;
  padding: 2px 8px;
  border-radius: 4px;
  border: 1px solid currentColor;
  background: color-mix(in srgb, currentColor 8%, transparent);
  text-transform: uppercase;
}
.section .id-line {
  font-family: "JetBrains Mono", monospace;
  font-size: 16px; font-weight: 500;
  color: var(--ink);
}
.section .id-hash { color: var(--ink-3); }
.section .date {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  color: var(--ink-3);
  margin-left: auto;
}
.section .desc {
  font-family: "Iowan Old Style", "Source Serif Pro", Charter, Georgia, serif;
  font-style: italic;
  color: var(--ink-2);
  font-size: 16px;
  margin: 6px 0 18px;
  line-height: 1.45;
}
.section .body-md {
  font-family: "Iowan Old Style", "Source Serif Pro", Charter, Georgia, serif;
  color: var(--ink);
  font-size: 17px;
  line-height: 1.7;
}
.section .body-md p { margin: 10px 0; }
.section .body-md > :first-child { margin-top: 0; }
.section .body-md > :last-child { margin-bottom: 0; }
.section .body-md h1 { font-size: 22px; margin: 18px 0 10px; font-weight: 600; }
.section .body-md h2 { font-size: 19px; margin: 14px 0 8px; font-weight: 600; }
.section .body-md h3 { font-size: 16px; margin: 12px 0 6px; font-weight: 600; color: var(--ink-2); }
.section .body-md a { color: var(--accent); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent); text-underline-offset: 2px; }
.section .body-md a:hover { text-decoration-color: var(--accent); }
.section .body-md code {
  font-family: "JetBrains Mono", monospace;
  font-size: 14px;
  background: var(--paper-2);
  padding: 1px 5px; border-radius: 4px;
  color: var(--accent);
}
.section .body-md pre {
  background: var(--paper-2);
  border: 1px solid var(--rule);
  padding: 12px 14px;
  border-radius: 6px;
  font-size: 13.5px;
  overflow-x: auto;
}
.section .body-md pre code { background: transparent; padding: 0; color: var(--ink); }
.section .body-md blockquote {
  border-left: 3px solid var(--accent-2);
  padding: 4px 0 4px 14px; margin: 10px 0;
  color: var(--ink-2); font-style: italic;
}
.section .body-md ul, .section .body-md ol { padding-left: 22px; }
.section .body-md table {
  border-collapse: collapse; margin: 10px 0; font-size: 14px;
}
.section .body-md th, .section .body-md td {
  border: 1px solid var(--rule); padding: 6px 10px;
}
.section .body-md th { background: var(--paper-2); font-weight: 600; }
.section .footer {
  margin-top: 22px; padding-top: 14px;
  border-top: 1px dashed var(--rule);
  display: flex; flex-wrap: wrap; gap: 18px;
  font-size: 12.5px;
  color: var(--ink-3);
}
.section .footer .label {
  font-family: "JetBrains Mono", monospace;
  font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--ink-3);
  margin-right: 6px;
}
.section .footer a {
  font-family: "JetBrains Mono", monospace;
  color: var(--accent-3);
  cursor: pointer;
}
.section .footer a:hover { text-decoration: underline; }

/* Graph ──────────────────────────────────────────────────────────── */
#cy { background: var(--paper); }
.graph-wrap {
  flex: 1; display: flex; flex-direction: column; min-width: 0;
}
.graph-controls {
  border-top: 1px solid var(--rule);
  padding: 8px 16px;
  font-size: 12px;
  color: var(--ink-3);
  background: var(--paper);
  display: flex; align-items: center; gap: 14px;
}
.pill-btn {
  padding: 4px 12px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: transparent;
  color: var(--ink-2); cursor: pointer;
  font-size: 11.5px;
  transition: all 120ms;
}
.pill-btn:hover { border-color: var(--accent); color: var(--accent); }

.details-pane {
  width: 380px; min-width: 320px;
  border-left: 1px solid var(--rule);
  background: var(--paper);
  overflow-y: auto;
  padding: 28px;
}
.details-empty { color: var(--ink-3); font-style: italic; padding-top: 24px; }

/* Scrollbars (subtle) ─────────────────────────────────────────────── */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 6px; border: 2px solid var(--paper); }
::-webkit-scrollbar-thumb:hover { background: var(--rule-2); }

/* Toast ──────────────────────────────────────────────────────────── */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--paper);
  padding: 8px 16px; border-radius: 999px;
  font-size: 13px; box-shadow: var(--shadow-hi);
  opacity: 0; pointer-events: none;
  transition: opacity 200ms, transform 200ms;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
</style>
</head>
<body class="mode-read">
<div style="display:flex; flex-direction:column; height:100%;">

<header class="topbar">
  <div class="brand">
    <span class="mark"></span>
    <span class="name">agd-memory</span>
    <span class="path mono" id="filepath"></span>
  </div>
  <div class="spacer"></div>
  <button class="search-trigger" id="search-trigger" title="Search (⌘K or /)">
    <span>search blocks…</span>
    <kbd>⌘K</kbd>
  </button>
  <div class="mode-toggle" role="tablist" aria-label="view mode">
    <button id="m-read" class="active" data-mode="read">Read</button>
    <button id="m-graph" data-mode="graph">Graph</button>
  </div>
  <button class="icon-btn" id="theme-toggle" title="Toggle theme">☼</button>
</header>

<div class="main">

  <!-- Timeline rail -->
  <aside class="rail" id="rail"></aside>

  <!-- Reader -->
  <div id="reader" class="read-only"></div>

  <!-- Graph -->
  <div class="graph-wrap graph-only">
    <div id="cy" style="flex:1; min-height: 0;"></div>
    <div class="graph-controls">
      <span>drag · scroll to zoom · click node</span>
      <span class="spacer" style="flex:1"></span>
      <button id="fit" class="pill-btn">fit</button>
      <button id="relayout" class="pill-btn">relayout</button>
    </div>
  </div>

  <!-- Details (graph mode only) -->
  <aside class="details-pane graph-only" id="details"></aside>
</div>
</div>

<!-- Search overlay -->
<div class="cmdk-overlay" id="cmdk">
  <div class="cmdk">
    <input type="text" id="cmdk-input" placeholder="search id, desc, body…" autocomplete="off">
    <div class="cmdk-results" id="cmdk-results"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const md = window.markdownit({ html: false, linkify: true, breaks: false });

// Kind palette: warm + restrained, no cyan ─────────────────────────
const KIND_COLORS = {
  "h1":         "#9a6500",
  "h2":         "#9a6500",
  "h3":         "#9a6500",
  "h4":         "#9a6500",
  "p":          "#5b574e",
  "x-user":     "#b34d1a",
  "x-feedback": "#9a6500",
  "x-project":  "#15623c",
  "x-reference":"#1e3a8a",
  "x-edge":     "#7c3aed",
  "x-stress":   "#6b7280",
  "code":       "#9a6500",
  "raw":        "#9a6500",
  "ul":         "#15623c",
  "ol":         "#15623c",
  "quote":      "#9d174d",
};
const colorFor = k => KIND_COLORS[k] || "#5b574e";

const dateRE = /(\d{4}-\d{2}-\d{2})/;
function dateFromId(id) {
  const m = (id || "").match(dateRE);
  return m ? m[1] : null;
}

let DATA = null;
let SELECTED = null;
let MODE = "read";
let cy = null;
let graphBuilt = false;

async function load() {
  const r = await fetch("/memory.json");
  const j = await r.json();
  if (j.error) {
    document.getElementById("reader").innerHTML = `<div style="padding:40px;color:var(--warn)">${j.error}</div>`;
    return;
  }
  DATA = j;
  document.getElementById("filepath").textContent = j.path;
  renderReader();
  renderRail();
}

function renderReader() {
  const r = document.getElementById("reader");
  r.innerHTML = "";
  const inner = document.createElement("div");
  inner.className = "reader-inner";

  // Stats card
  const stats = document.createElement("div");
  stats.className = "reader-stats";
  const k = DATA.stats.kinds;
  stats.innerHTML = `
    <span class="stat"><span class="n">${DATA.stats.blocks}</span><span class="l">blocks</span></span>
    <span class="stat"><span class="n">${DATA.stats.edges}</span><span class="l">edges</span></span>
    <span class="stat"><span class="n">${Object.keys(k).length}</span><span class="l">kinds</span></span>
    <span class="stat"><span class="n">${(DATA.stats.bytes/1024).toFixed(1)}</span><span class="l">KB</span></span>
  `;
  inner.appendChild(stats);

  for (const b of DATA.blocks) {
    const sec = document.createElement("section");
    sec.className = "section";
    sec.id = "b-" + b.id;

    const c = colorFor(b.kind);
    const head = document.createElement("div");
    head.className = "meta-top";
    head.innerHTML = `
      <span class="kind-chip" style="color:${c};">${escapeHTML(b.kind)}</span>
      <span class="id-line"><span class="id-hash">#</span>${escapeHTML(b.id)}</span>
      ${dateFromId(b.id) ? `<span class="date">${dateFromId(b.id)}</span>` : ""}
    `;
    sec.appendChild(head);

    if (b.desc) {
      const d = document.createElement("div");
      d.className = "desc";
      d.textContent = b.desc;
      sec.appendChild(d);
    }

    if (b.body && b.body.length) {
      const body = document.createElement("div");
      body.className = "body-md";
      body.innerHTML = md.render(b.body);
      sec.appendChild(body);
    }

    if (b.refs.length || b.backlinks.length || (b.attrs && Object.keys(b.attrs).length)) {
      const f = document.createElement("div");
      f.className = "footer";
      const parts = [];
      if (b.refs.length)
        parts.push(`<span><span class="label">Refs →</span>${b.refs.map(r => `<a data-id="${r}">#${r}</a>`).join(" ")}</span>`);
      if (b.backlinks.length)
        parts.push(`<span><span class="label">← Backlinks</span>${b.backlinks.map(r => `<a data-id="${r}">#${r}</a>`).join(" ")}</span>`);
      if (b.attrs && Object.keys(b.attrs).length) {
        const ats = Object.entries(b.attrs).map(([k,v]) => `${k}=${escapeHTML(JSON.stringify(v))}`).join(" ");
        parts.push(`<span><span class="label">Attrs</span><span class="mono">${ats}</span></span>`);
      }
      f.innerHTML = parts.join("");
      sec.appendChild(f);
    }

    inner.appendChild(sec);
  }
  r.appendChild(inner);

  // Wire ref/backlink clicks
  r.querySelectorAll("a[data-id]").forEach(a => {
    a.onclick = e => { e.preventDefault(); jumpTo(a.dataset.id); };
  });

  // Observe scroll → highlight active rail item
  setupScrollSpy();
}

function renderRail() {
  const rail = document.getElementById("rail");
  rail.innerHTML = "";
  // Group consecutive blocks by date (id-derived); ungrouped blocks
  // share an "untimed" header.
  let lastDate = null;
  let group = null;
  for (const b of DATA.blocks) {
    const d = dateFromId(b.id) || "—";
    if (d !== lastDate) {
      group = document.createElement("div");
      group.className = "rail-group";
      const dh = document.createElement("div");
      dh.className = "rail-date";
      dh.textContent = d === "—" ? "no date" : d;
      group.appendChild(dh);
      rail.appendChild(group);
      lastDate = d;
    }
    const item = document.createElement("div");
    item.className = "rail-item";
    item.dataset.id = b.id;
    item.onclick = () => jumpTo(b.id);
    item.innerHTML = `
      <span class="dot" style="background:${colorFor(b.kind)};"></span>
      <div class="id">#${escapeHTML(b.id)}</div>
      ${b.desc ? `<div class="desc">${escapeHTML(b.desc)}</div>` : ""}
    `;
    group.appendChild(item);
  }
}

function setupScrollSpy() {
  const reader = document.getElementById("reader");
  const sections = reader.querySelectorAll(".section");
  const obs = new IntersectionObserver((entries) => {
    // Pick the section closest to the top within view
    let best = null, bestTop = Infinity;
    for (const en of entries) {
      if (en.isIntersecting) {
        const top = en.boundingClientRect.top;
        if (top >= 0 && top < bestTop) { bestTop = top; best = en.target; }
      }
    }
    if (best) {
      const id = best.id.replace(/^b-/, "");
      setRailActive(id);
    }
  }, { root: reader, rootMargin: "0px 0px -70% 0px", threshold: 0.01 });
  sections.forEach(s => obs.observe(s));
}

function setRailActive(id) {
  document.querySelectorAll(".rail-item").forEach(el => {
    el.classList.toggle("active", el.dataset.id === id);
  });
  // keep active item visible in rail
  const a = document.querySelector(`.rail-item.active`);
  if (a) {
    const r = document.getElementById("rail");
    const off = a.offsetTop - r.offsetTop - r.clientHeight / 3;
    r.scrollTo({ top: off, behavior: "smooth" });
  }
}

function jumpTo(id) {
  SELECTED = id;
  if (MODE === "read") {
    const el = document.getElementById("b-" + id);
    if (el) {
      el.scrollIntoView({ behavior: "smooth", block: "start" });
      el.classList.remove("flash");
      void el.offsetWidth;
      el.classList.add("flash");
    }
    setRailActive(id);
  } else {
    selectGraph(id);
  }
}

function setMode(m) {
  MODE = m;
  document.body.classList.toggle("mode-read",  m === "read");
  document.body.classList.toggle("mode-graph", m === "graph");
  document.getElementById("m-read").classList.toggle("active",  m === "read");
  document.getElementById("m-graph").classList.toggle("active", m === "graph");
  if (m === "graph" && !graphBuilt) {
    setTimeout(() => { renderGraph(); graphBuilt = true; }, 30);
  } else if (m === "graph" && cy) {
    setTimeout(() => { cy.resize(); cy.fit(undefined, 30); }, 50);
  }
}

function renderGraph() {
  const elements = [];
  const present = new Set(DATA.blocks.map(b => b.id));
  for (const b of DATA.blocks) {
    elements.push({ data: { id: b.id, kind: b.kind, color: colorFor(b.kind), degree: b.refs.length + b.backlinks.length }});
  }
  for (const b of DATA.blocks) {
    for (const t of b.refs) if (present.has(t)) elements.push({ data: { id: `${b.id}__${t}`, source: b.id, target: t }});
  }
  const styles = getComputedStyle(document.documentElement);
  const edgeColor = styles.getPropertyValue("--rule-2").trim() || "#c8bb96";
  const nodeStroke = styles.getPropertyValue("--paper").trim() || "#faf6ed";
  cy = cytoscape({
    container: document.getElementById("cy"),
    elements,
    style: [
      { selector: "node", style: {
          "background-color": "data(color)",
          "label": "data(id)",
          "font-family": "JetBrains Mono, ui-monospace, monospace",
          "font-size": 10,
          "color": styles.getPropertyValue("--ink-2").trim(),
          "text-valign": "bottom", "text-margin-y": 6,
          "text-outline-color": nodeStroke, "text-outline-width": 2,
          "width": "mapData(degree, 0, 8, 14, 36)",
          "height": "mapData(degree, 0, 8, 14, 36)",
          "border-width": 2, "border-color": nodeStroke,
          "transition-property": "background-color, border-color, opacity",
          "transition-duration": 150,
        }
      },
      { selector: "node:selected", style: { "border-width": 3, "border-color": styles.getPropertyValue("--accent").trim() }},
      { selector: "node.faded", style: { "opacity": 0.18 }},
      { selector: "edge", style: {
          "width": 1.4, "line-color": edgeColor,
          "target-arrow-color": edgeColor, "target-arrow-shape": "triangle",
          "curve-style": "bezier", "arrow-scale": 0.7, "opacity": 0.7,
        }
      },
      { selector: "edge.highlight", style: {
          "line-color": styles.getPropertyValue("--accent").trim(),
          "target-arrow-color": styles.getPropertyValue("--accent").trim(),
          "width": 2.4, "opacity": 1,
        }
      },
      { selector: "edge.faded", style: { "opacity": 0.07 }},
    ],
    layout: { name: "cose", animate: false, idealEdgeLength: 90, nodeRepulsion: 6000, padding: 30 },
    wheelSensitivity: 0.2,
  });
  cy.on("tap", "node", e => selectGraph(e.target.id()));
  cy.on("tap", evt => { if (evt.target === cy) selectGraph(null); });
  document.getElementById("fit").onclick = () => cy.fit(undefined, 30);
  document.getElementById("relayout").onclick = () =>
    cy.layout({ name: "cose", animate: true, animationDuration: 600, idealEdgeLength: 90, nodeRepulsion: 6000, padding: 30 }).run();
  setTimeout(() => { cy.resize(); cy.fit(undefined, 30); }, 60);
}

function selectGraph(id) {
  SELECTED = id;
  if (cy) {
    cy.elements().removeClass("highlight");
    cy.nodes().unselect();
    if (id) {
      const n = cy.getElementById(id);
      if (n.length) {
        n.select(); n.connectedEdges().addClass("highlight");
        cy.animate({ center: { eles: n }, zoom: Math.max(cy.zoom(), 1.1) }, { duration: 350 });
      }
    }
  }
  renderDetails(id);
}

function renderDetails(id) {
  const el = document.getElementById("details");
  if (!id) { el.innerHTML = `<div class="details-empty">click a node to see its body</div>`; return; }
  const b = DATA.blocks.find(x => x.id === id);
  if (!b) { el.innerHTML = `<div class="details-empty">id not found: ${id}</div>`; return; }
  const c = colorFor(b.kind);
  el.innerHTML = `
    <div class="meta-top" style="margin-bottom:6px;">
      <span class="kind-chip" style="color:${c};">${escapeHTML(b.kind)}</span>
      <span class="id-line"><span class="id-hash">#</span>${escapeHTML(b.id)}</span>
    </div>
    ${b.desc ? `<div class="desc">${escapeHTML(b.desc)}</div>` : ""}
    ${b.body ? `<div class="body-md" style="margin-top:14px;">${md.render(b.body)}</div>` : ""}
    ${b.refs.length ? `<div class="footer"><span><span class="label">Refs →</span>${b.refs.map(r => `<a data-id="${r}">#${r}</a>`).join(" ")}</span></div>` : ""}
    ${b.backlinks.length ? `<div class="footer"><span><span class="label">← Backlinks</span>${b.backlinks.map(r => `<a data-id="${r}">#${r}</a>`).join(" ")}</span></div>` : ""}
  `;
  el.querySelectorAll("a[data-id]").forEach(a => { a.onclick = () => { setMode("read"); setTimeout(() => jumpTo(a.dataset.id), 150); };});
}

function escapeHTML(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c])); }

// ── Search overlay (cmd-k) ──────────────────────────────────────────
function openSearch() {
  document.getElementById("cmdk").classList.add("open");
  document.getElementById("cmdk-input").value = "";
  document.getElementById("cmdk-input").focus();
  renderCmdk("");
}
function closeSearch() { document.getElementById("cmdk").classList.remove("open"); }
function renderCmdk(q) {
  const ql = (q || "").toLowerCase().trim();
  const matches = DATA.blocks.filter(b => {
    if (!ql) return true;
    return (b.id || "").toLowerCase().includes(ql)
        || (b.desc || "").toLowerCase().includes(ql)
        || (b.body || "").toLowerCase().includes(ql);
  }).slice(0, 30);
  const r = document.getElementById("cmdk-results");
  r.innerHTML = matches.map((b, i) =>
    `<div class="cmdk-result ${i===0?"active":""}" data-id="${b.id}">
       <span class="kind-chip" style="color:${colorFor(b.kind)};">${b.kind}</span>
       <span class="id">#${escapeHTML(b.id)}</span>
       ${b.desc ? `<span class="desc">${escapeHTML(b.desc)}</span>` : ""}
     </div>`).join("") || `<div style="padding:18px;color:var(--ink-3);font-style:italic;">no matches</div>`;
  r.querySelectorAll(".cmdk-result").forEach(el => {
    el.onclick = () => { closeSearch(); jumpTo(el.dataset.id); };
  });
}

// ── Theme toggle ────────────────────────────────────────────────────
function setTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  document.getElementById("theme-toggle").textContent = t === "dark" ? "☾" : "☼";
  localStorage.setItem("agd-viewer-theme", t);
  if (cy) renderGraph(); // re-skin graph palette
}
const initialTheme = localStorage.getItem("agd-viewer-theme") || "light";
setTheme(initialTheme);

// ── Wiring ──────────────────────────────────────────────────────────
document.getElementById("search-trigger").onclick = openSearch;
document.getElementById("cmdk-input").addEventListener("input", e => renderCmdk(e.target.value));
document.getElementById("cmdk").addEventListener("click", e => { if (e.target.id === "cmdk") closeSearch(); });
document.getElementById("m-read").onclick = () => setMode("read");
document.getElementById("m-graph").onclick = () => setMode("graph");
document.getElementById("theme-toggle").onclick = () => setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");

window.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openSearch(); return; }
  if (e.key === "/" && !["INPUT","TEXTAREA"].includes(document.activeElement.tagName)) { e.preventDefault(); openSearch(); return; }
  if (e.key === "Escape") {
    if (document.getElementById("cmdk").classList.contains("open")) { closeSearch(); return; }
    if (MODE === "graph") selectGraph(null);
  }
  // cmdk arrow nav
  if (document.getElementById("cmdk").classList.contains("open")) {
    const items = [...document.querySelectorAll(".cmdk-result")];
    if (!items.length) return;
    const cur = items.findIndex(i => i.classList.contains("active"));
    if (e.key === "ArrowDown") { e.preventDefault(); items[cur]?.classList.remove("active"); items[Math.min(items.length-1, cur+1)].classList.add("active"); }
    if (e.key === "ArrowUp")   { e.preventDefault(); items[cur]?.classList.remove("active"); items[Math.max(0, cur-1)].classList.add("active"); }
    if (e.key === "Enter")     { const a = items.find(i => i.classList.contains("active")); if (a) { closeSearch(); jumpTo(a.dataset.id); }}
  }
});

load();
</script>
</body>
